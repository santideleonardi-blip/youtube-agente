name: Producir y subir video

on:
  schedule:
    # 4 turnos por día (UTC): 11:07, 14:07, 18:07 y 22:07 UTC = 08:07, 11:07, 15:07 y 19:07 en Argentina.
    # El agente Estratega decide cuántos se usan (1 a 4 videos por día); los demás salen al instante.
    # La PUBLICACIÓN no es a esta hora: el video queda programado para el mejor horario de EE.UU.
    - cron: "7 11 * * *"
    - cron: "7 14 * * *"
    - cron: "7 18 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prueba: genera el video pero NO lo sube (lo podés descargar en Artifacts)"
        type: boolean
        default: true
      format:
        description: "Forzar formato (vacío = decide el analista)"
        type: choice
        options: ["", "short", "long"]
        default: ""
      max_actor:
        description: "Max actor: Max de cuerpo entero animado dentro de las escenas (en prueba)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: produce-video
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg y fuentes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cache del modelo de voz (Kokoro)
        uses: actions/cache@v4
        with:
          path: models
          key: models-v3

      - name: Descargar modelo de voz si falta
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin
          [ -f models/depth_anything_v2_small.onnx ] || curl -sSL -o models/depth_anything_v2_small.onnx \
            https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx || true
          # Rhubarb Lip Sync: mueve la boca de Max al ritmo de la voz (si falla, se usa el volumen)
          if [ ! -x models/rhubarb/rhubarb ]; then
            curl -sSL -o /tmp/rhubarb.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip \
              && unzip -q -o /tmp/rhubarb.zip -d /tmp/rhubarb \
              && mv /tmp/rhubarb/Rhubarb-Lip-Sync-1.13.0-Linux models/rhubarb || true
          fi
          ls -la models

      - name: Correr los agentes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'scheduled' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          FORCE_FORMAT: ${{ inputs.format }}
          RHUBARB_BIN: models/rhubarb/rhubarb
          MAX_NARRATOR: ${{ vars.MAX_NARRATOR || '1' }}
          MAX_ACTOR: ${{ (github.event_name == 'workflow_dispatch' && inputs.max_actor) && '1' || vars.MAX_ACTOR || '0' }}
        timeout-minutes: 80
        run: python -u main.py

      - name: Guardar el video como artifact (para revisarlo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Guardar la memoria de los agentes
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          git config user.name "youtube-agente-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || git commit -m "Actualizar memoria de los agentes [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
